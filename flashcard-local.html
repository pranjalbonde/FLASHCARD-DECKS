<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deckhand – Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6edf5;--surface:#f6f9fc;--card:#fff;--ink:#14213d;--muted:#5b6b86;--line:#c9d4e3;--blue:#2f5fe0;--on-blue:#fff;--hi:#f5c518;--bad:#c93b3b;--good:#1f8a5b;
--ui:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:'Newsreader',Georgia,'Times New Roman',serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1626;--surface:#16203a;--card:#1d2a4a;--ink:#e8eefb;--muted:#9aa9c7;--line:#2c3c63;--blue:#6f93ff;--on-blue:#0f1626;--hi:#f5c518;--bad:#ff7b7b;--good:#55d49b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1626;--surface:#16203a;--card:#1d2a4a;--ink:#e8eefb;--muted:#9aa9c7;--line:#2c3c63;--blue:#6f93ff;--on-blue:#0f1626;--hi:#f5c518;--bad:#ff7b7b;--good:#55d49b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ui);min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.02em;background:none;border:0;padding:0}
.brand span{background:linear-gradient(transparent 60%,var(--hi) 60%)}
h1{font-size:2rem;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
h2{font-size:1.15rem;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:10px;padding:9px 16px;font-weight:600}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.deck{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;position:relative;
background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-position:0 44px;background-repeat:no-repeat;background-size:100% 56px}
.deck h3{margin:0;font-size:1.15rem}
.deck .meta{color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--good)}
.due{display:inline-block;background:var(--hi);color:#14213d;font-weight:700;font-size:.8rem;padding:2px 9px;border-radius:20px}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px}
label{font-weight:600;font-size:.9rem;display:block;margin-bottom:4px}
input[type=text],textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{min-height:76px;resize:vertical;font-family:var(--serif);font-size:1.05rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.cardrow{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:start;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.cardrow .t{font-family:var(--serif);font-size:1.05rem;white-space:pre-wrap;word-break:break-word}
.cardrow .box{font-size:.78rem;color:var(--muted)}
@media(max-width:600px){.cardrow{grid-template-columns:1fr}}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
/* study */
.study{max-width:640px;margin:0 auto}
.prog{display:flex;justify-content:space-between;color:var(--muted);font-size:.92rem;margin-bottom:8px}
.stage{perspective:1400px;margin:14px 0 18px}
.flip{position:relative;width:100%;min-height:300px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;cursor:pointer;border:0;background:none;padding:0;display:block;text-align:center}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1.5px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;box-shadow:6px 6px 0 var(--hi);
font-family:var(--serif);font-size:clamp(1.4rem,4.5vw,2rem);line-height:1.3;white-space:pre-wrap;word-break:break-word;overflow:auto}
.face small{font-family:var(--ui);font-size:.8rem;color:var(--muted);margin-top:14px}
.back{transform:rotateY(180deg);box-shadow:-6px 6px 0 var(--blue)}
@media(prefers-reduced-motion:reduce){.flip{transition:none}}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{padding:13px 8px}
.rate small{display:block;font-weight:400;opacity:.8}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:3rem;font-weight:800;letter-spacing:-.03em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:600;z-index:20}
kbd{font-family:var(--ui);border:1px solid var(--line);border-radius:5px;padding:0 6px;font-size:.8rem;background:var(--surface)}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin-top:14px}
select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.gen{margin-bottom:20px;border-color:var(--blue)}
.gen label{font-weight:400;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
var KEY='deckhand-v1', DAY=86400000, GAPS=[0,0,1,3,7,16]; // days until next review by box (1-5)
var state=load(), ui={view:'home',deck:null,s:null,toast:''};
var app=document.getElementById('app');

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function load(){
  try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r);if(d&&Array.isArray(d.decks))return d}}catch(e){}
  var now=Date.now();
  function c(q,a){return {id:uid(),q:q,a:a,box:1,due:now}}
  return {decks:[{id:uid(),name:'Sample: World capitals',cards:[
    c('Capital of Australia?','Canberra'),c('Capital of Canada?','Ottawa'),c('Capital of Brazil?','Brasília'),
    c('Capital of Kenya?','Nairobi'),c('Capital of Japan?','Tokyo'),c('Capital of Turkey?','Ankara')]}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(m){ui.toast=m;render();setTimeout(function(){ui.toast='';render()},1800)}
function deck(){return state.decks.filter(function(d){return d.id===ui.deck})[0]}
function dueCards(d){var n=Date.now();return d.cards.filter(function(c){return c.due<=n})}
function go(v,id){ui.view=v;if(id!==undefined)ui.deck=id;ui.s=null;render();window.scrollTo(0,0)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function head(){return '<header class="top"><button class="brand" data-a="home"><span>Deckhand</span></button><div class="row"><button class="btn sm" data-a="key">API key</button><button class="btn sm" data-a="theme">Theme</button><button class="btn sm" data-a="export">Export</button><button class="btn sm" data-a="import">Import</button></div></header>'}

function home(){
  var h=head()+'<h1>Your decks</h1><p class="sub">Create a deck, add cards, and study what’s due. Cards you miss come back sooner.</p>';
  h+=genPanel(true);h+='<h2 style="margin-top:0">Or start an empty deck</h2><div class="panel row" style="margin-bottom:20px"><input type="text" id="newdeck" placeholder="New deck name" aria-label="New deck name" style="flex:1;min-width:180px"><button class="btn primary" data-a="adddeck">Create deck</button></div>';
  if(!state.decks.length)return h+'<div class="empty">No decks yet. Name one above to get started.</div>';
  h+='<div class="grid">';
  state.decks.forEach(function(d){
    var n=d.cards.length,due=dueCards(d).length,mast=d.cards.filter(function(c){return c.box>=4}).length;
    h+='<button class="deck" data-a="open" data-id="'+d.id+'"><h3>'+esc(d.name)+'</h3><div class="meta">'+n+' card'+(n===1?'':'s')+' · '+mast+' mastered</div>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+(n?mast/n*100:0)+'%"></i></div>'+
    (due?'<span class="due">'+due+' due now</span>':'<span class="meta">'+(n?'All caught up':'Empty deck')+'</span>')+'</button>';
  });
  return h+'</div>';
}

function deckView(){
  var d=deck(); if(!d){go('home');return ''}
  var due=dueCards(d).length;
  var h=head()+'<div class="row" style="justify-content:space-between;align-items:flex-start"><div><h1>'+esc(d.name)+'</h1><p class="sub">'+d.cards.length+' cards · '+due+' due now</p></div>'+
   '<div class="row"><button class="btn sm" data-a="rename">Rename</button><button class="btn sm danger" data-a="deldeck">Delete deck</button></div></div>';
  h+='<div class="row" style="margin-bottom:8px"><button class="btn primary" data-a="study" data-m="due"'+(due?'':' disabled')+'>Study due cards ('+due+')</button><button class="btn" data-a="study" data-m="all"'+(d.cards.length?'':' disabled')+'>Study all, shuffled</button></div>';
  h+=genPanel(false);h+='<h2>Add a card by hand</h2><div class="panel"><div class="two"><div><label for="nq">Front</label><textarea id="nq" placeholder="Question or term"></textarea></div><div><label for="na">Back</label><textarea id="na" placeholder="Answer or definition"></textarea></div></div><div class="row" style="margin-top:12px"><button class="btn primary" data-a="addcard">Add card</button><span class="hint" style="margin:0">Tip: press <kbd>Ctrl</kbd>+<kbd>Enter</kbd> to add</span></div></div>';
  h+='<h2>Bulk add</h2><div class="panel"><label for="bulk">One card per line, front and back separated by <code>::</code> or a tab</label><textarea id="bulk" placeholder="Mitochondria :: Powerhouse of the cell&#10;H2O :: Water"></textarea><div style="margin-top:10px"><button class="btn" data-a="bulk">Add lines as cards</button></div></div>';
  h+='<h2>Cards</h2>';
  if(!d.cards.length)h+='<div class="empty">This deck has no cards. Add your first one above.</div>';
  d.cards.forEach(function(c){
    h+='<div class="cardrow"><div><div class="box">Front</div><div class="t">'+esc(c.q)+'</div></div><div><div class="box">Back · box '+c.box+' of 5</div><div class="t">'+esc(c.a)+'</div></div><div class="row"><button class="btn sm" data-a="editcard" data-id="'+c.id+'">Edit</button><button class="btn sm danger" data-a="delcard" data-id="'+c.id+'" aria-label="Delete card">Delete</button></div></div>';
  });
  return h;
}

function studyView(){
  var d=deck(),s=ui.s; if(!d||!s){go('home');return ''}
  var h=head();
  if(s.i>=s.queue.length){
    var pct=s.seen?Math.round(s.right/s.seen*100):0;
    return h+'<div class="study done"><div class="big">'+(s.seen?pct+'%':'—')+'</div><p>'+(s.seen?'You answered '+s.right+' of '+s.seen+' correctly this session.':'Nothing was due in this deck.')+'</p><div class="row" style="justify-content:center"><button class="btn primary" data-a="open" data-id="'+d.id+'">Back to deck</button><button class="btn" data-a="home">All decks</button></div></div>';
  }
  var c=s.queue[s.i];
  h+='<div class="study"><div class="prog"><span>'+esc(d.name)+'</span><span>Card '+(s.i+1)+' of '+s.queue.length+'</span></div><div class="bar" aria-hidden="true"><i style="width:'+(s.i/s.queue.length*100)+'%"></i></div>';
  h+='<div class="stage"><button class="flip'+(s.flipped?' on':'')+'" data-a="flip" aria-label="Flip card"><div class="face">'+esc(c.q)+'<small>Click or press Space to flip</small></div><div class="face back">'+esc(c.a)+'</div></button></div>';
  if(s.flipped)h+='<div class="rate"><button class="btn danger" data-a="rate" data-r="0">Missed it<small>1</small></button><button class="btn" data-a="rate" data-r="1">Got it<small>2</small></button><button class="btn primary" data-a="rate" data-r="2">Easy<small>3</small></button></div>';
  else h+='<div class="rate" style="grid-template-columns:1fr"><button class="btn primary" data-a="flip">Show answer</button></div>';
  h+='<p class="hint">Keys: <kbd>Space</kbd> flip · <kbd>1</kbd> missed · <kbd>2</kbd> got it · <kbd>3</kbd> easy</p></div>';
  return h;
}

function genPanel(home){
  var sel=ui.gcount||'auto';
  var opts=['auto','5','10','20','30'].map(function(o){return '<option value="'+o+'"'+(o===sel?' selected':'')+'>'+(o==='auto'?'Auto number of cards':o+' cards')+'</option>'}).join('');
  return '<div class="panel gen"><h2 style="margin-top:0">'+(home?'Make a deck from your notes':'Generate cards from your notes')+'</h2><label for="notes">Paste text, notes or a chapter. Claude reads it and writes the questions and answers for you (needs your Anthropic API key).</label><textarea id="notes" placeholder="Paste anything you want to learn…" style="min-height:150px">'+esc(ui.notes||'')+'</textarea><div class="row" style="margin-top:12px">'+(home?'<input type="text" id="gname" placeholder="Deck name (optional)" aria-label="Deck name" value="'+esc(ui.gname||'')+'" style="flex:1;min-width:160px">':'')+'<select id="gcount" aria-label="Number of cards">'+opts+'</select><button class="btn primary" data-a="gen" data-home="'+(home?1:0)+'"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Generating…':'Generate cards')+'</button></div></div>';
}

async function gen(home){
  if(ui.busy)return;
  var notes=(ui.notes||'').trim();
  if(notes.length<40){toast('Paste a bit more text first');return}
  var key='';try{key=localStorage.getItem('deckhand-key')||''}catch(e){}
  if(!key){key=(window.prompt('Paste your Anthropic API key (from console.anthropic.com). It is stored only in this browser and sent only to Anthropic.')||'').trim();if(!key)return;try{localStorage.setItem('deckhand-key',key)}catch(e){}}
  ui.busy=true;render();
  var n=ui.gcount&&ui.gcount!=='auto'?ui.gcount:'';
  var instr='You create study flashcards from the notes below. '+(n?'Write exactly '+n+' cards (fewer only if the text truly lacks material). ':'Choose a sensible number of cards, roughly one per key idea, between 5 and 40. ')+'Rules: each question must stand alone without the notes; each answer is short and precise (one to three sentences); cover definitions, key facts, causes and relationships; no duplicates; use only information from the notes. Reply with ONLY a JSON array of objects shaped like [{"q":"question","a":"answer"}].\n\nNOTES:\n'+notes.slice(0,12000);
  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-5-5',max_tokens:8000,messages:[{role:'user',content:instr}]})});
    if(res.status===401){try{localStorage.removeItem('deckhand-key')}catch(e){}var er=new Error('auth');er.userMsg='That API key was rejected. Click Generate to enter it again.';throw er}
    if(res.status===429){var er2=new Error('rate');er2.userMsg='Rate limited. Wait a moment and retry.';throw er2}
    if(!res.ok){var er3=new Error('http');er3.userMsg='API error '+res.status+'. Check your key and credits.';throw er3}
    var data=await res.json();
    var txt=(data.content||[]).map(function(b){return b.text||''}).join('');
    var out=JSON.parse(txt.slice(txt.indexOf('['),txt.lastIndexOf(']')+1));
    var arr=Array.isArray(out)?out:(out&&out.cards)||[];
    arr=arr.filter(function(c){return c&&c.q&&c.a});
    if(!arr.length)throw new Error('empty');
    if(home){var nd={id:uid(),name:(ui.gname||'').trim()||'Notes deck, '+new Date().toLocaleDateString(),cards:[]};state.decks.push(nd);ui.deck=nd.id;ui.view='deck'}
    var added=addCards(arr.map(function(c){return [String(c.q),String(c.a)]}));
    ui.notes='';ui.gname='';ui.busy=false;render();window.scrollTo(0,0);toast(added+' cards created');
  }catch(e){
    ui.busy=false;render();
    toast(e&&e.userMsg?e.userMsg:(e instanceof TypeError?'Network error. Are you online?':'Couldn’t generate cards. Try again'));
  }
}

function render(){
  var a=document.activeElement,keep=a&&a.id&&['newdeck','nq','na','bulk','notes','gname'].indexOf(a.id)>-1?{id:a.id,v:a.value}:null;
  app.innerHTML=(ui.view==='home'?home():ui.view==='deck'?deckView():studyView())+(ui.toast?'<div class="toast" role="status">'+esc(ui.toast)+'</div>':'');
  if(keep){var e=document.getElementById(keep.id);if(e){e.value=keep.v;e.focus()}}
}

function rate(r){
  var s=ui.s,c=s.queue[s.i],real=deck().cards.filter(function(x){return x.id===c.id})[0];
  s.seen++;
  if(r===0){real.box=1;real.due=Date.now();s.queue.push(c);s.seen--;}
  else{s.right++;real.box=Math.min(5,real.box+(r===2?2:1));real.due=Date.now()+GAPS[real.box]*DAY}
  s.i++;s.flipped=false;save();render();
}

function addCards(list){
  var d=deck(),n=0;
  list.forEach(function(p){if(p[0].trim()&&p[1].trim()){d.cards.push({id:uid(),q:p[0].trim(),a:p[1].trim(),box:1,due:Date.now()});n++}});
  save();return n;
}

app.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,d=ui.deck?deck():null;
  if(a==='home')go('home');
  else if(a==='open')go('deck',t.dataset.id);
  else if(a==='adddeck'){var i=document.getElementById('newdeck'),v=i.value.trim();if(!v){toast('Enter a deck name first');return}
    var nd={id:uid(),name:v,cards:[]};state.decks.push(nd);save();go('deck',nd.id)}
  else if(a==='rename'){var n=prompt('Deck name',d.name);if(n&&n.trim()){d.name=n.trim();save();render()}}
  else if(a==='deldeck'){if(confirm('Delete “'+d.name+'” and all its cards?')){state.decks=state.decks.filter(function(x){return x!==d});save();go('home')}}
  else if(a==='addcard'){var q=document.getElementById('nq'),an=document.getElementById('na');
    if(!q.value.trim()||!an.value.trim()){toast('Fill in both sides of the card');return}
    addCards([[q.value,an.value]]);q.value='';an.value='';render();document.getElementById('nq').focus();toast('Card added')}
  else if(a==='bulk'){var b=document.getElementById('bulk').value.split('\n').map(function(l){var k=l.indexOf('::');if(k<0)k=l.indexOf('\t'),w=1;else w=2;return k<0?['','']:[l.slice(0,k),l.slice(k+w)]});
    var n2=addCards(b);if(!n2){toast('No valid lines. Use front :: back');return}document.getElementById('bulk').value='';render();toast(n2+' card'+(n2===1?'':'s')+' added')}
  else if(a==='delcard'){d.cards=d.cards.filter(function(c){return c.id!==t.dataset.id});save();render();toast('Card deleted')}
  else if(a==='editcard'){var c=d.cards.filter(function(x){return x.id===t.dataset.id})[0];
    var f=prompt('Front',c.q);if(f===null)return;var b2=prompt('Back',c.a);if(b2===null)return;
    if(f.trim()&&b2.trim()){c.q=f.trim();c.a=b2.trim();save();render();toast('Card updated')}else toast('Both sides need text')}
  else if(a==='study'){var q2=t.dataset.m==='due'?dueCards(d):d.cards.slice();if(!q2.length)return;
    ui.s={queue:shuffle(q2),i:0,flipped:false,seen:0,right:0};ui.view='study';render();window.scrollTo(0,0)}
  else if(a==='key'){var k=window.prompt('Anthropic API key (leave empty to remove the saved key)','');if(k===null)return;try{if(k.trim()){localStorage.setItem('deckhand-key',k.trim());toast('API key saved')}else{localStorage.removeItem('deckhand-key');toast('API key removed')}}catch(e){}}
  else if(a==='gen')gen(t.dataset.home==='1');
  else if(a==='flip'){ui.s.flipped=!ui.s.flipped;render()}
  else if(a==='rate')rate(+t.dataset.r);
  else if(a==='theme'){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'}
  else if(a==='export'){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='deckhand-backup.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u)},500)}
  else if(a==='import'){var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=function(){var f=inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
      try{var j=JSON.parse(rd.result);if(!j||!Array.isArray(j.decks))throw 0;
        j.decks.forEach(function(x){if(x&&x.name&&Array.isArray(x.cards)){state.decks.push({id:uid(),name:String(x.name),cards:x.cards.filter(function(c){return c&&c.q&&c.a}).map(function(c){return {id:uid(),q:String(c.q),a:String(c.a),box:Math.min(5,Math.max(1,+c.box||1)),due:+c.due||Date.now()}})})}});
        save();go('home');toast('Import complete')}catch(e){toast('That file isn’t a Deckhand backup')}};rd.readAsText(f)};inp.click()}
});

app.addEventListener('input',function(e){var i=e.target.id;if(i==='notes')ui.notes=e.target.value;else if(i==='gname')ui.gname=e.target.value;else if(i==='gcount')ui.gcount=e.target.value});
app.addEventListener('change',function(e){if(e.target.id==='gcount')ui.gcount=e.target.value});

document.addEventListener('keydown',function(e){
  var tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&tag==='input'&&e.target.id==='newdeck'){e.preventDefault();document.querySelector('[data-a="adddeck"]').click();return}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&(e.target.id==='nq'||e.target.id==='na')){document.querySelector('[data-a="addcard"]').click();return}
  if(ui.view!=='study'||!ui.s||ui.s.i>=ui.s.queue.length||tag==='input'||tag==='textarea')return;
  if(e.key===' '||e.key==='Enter'){if(tag==='button'&&e.key==='Enter')return;e.preventDefault();ui.s.flipped=!ui.s.flipped;render()}
  else if(ui.s.flipped&&'123'.indexOf(e.key)>-1&&e.key){rate(+e.key-1)}
});
render();
})();
</script>
</body>
</html>
